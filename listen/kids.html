<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu nói cho con</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: single reading column, sticky player bar, one row per phrase */
:root{--bg:#f6f7f4;--fg:#1d2420;--muted:#5f6b64;--card:#ffffff;--line:#dfe3dd;--accent:#1f7a5c;--accent-ink:#ffffff;--hi:#e3f2ea;
--q:#c2502e;--q-bg:#fbeee9;--a:#2e7d32;--a-bg:#e8f5e9;
--display:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141916;--fg:#e8ece9;--muted:#9aa69f;--card:#1c231f;--line:#2c3530;--accent:#5cc49c;--accent-ink:#0f1512;--hi:#21362c;--q:#f08a6c;--q-bg:#3a2520;--a:#7fcf86;--a-bg:#1f3322;color-scheme:dark}}
li.q:not(.on){background:var(--q-bg);border-color:var(--q)}
li.q .txt{color:var(--q);font-weight:600}
li.a:not(.on){background:var(--a-bg);border-color:var(--a)}
li.a .txt{color:var(--a);font-weight:600}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1{font-family:var(--display);font-weight:600;font-size:1.8rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label{color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:center}
select{font:inherit;font-size:.9rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;max-width:180px}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:28px 0 8px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
li.on{background:var(--hi);border-color:var(--accent)}
li .play{flex:none;width:40px;height:40px;padding:0;border-radius:50%;font-size:14px}
.txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.who{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.9rem;margin-top:24px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.abc button{font-family:var(--display);font-size:1.6rem;padding:10px 0;line-height:1.2}
.abc button.on{background:var(--hi);border-color:var(--accent)}
.abc small{display:block;font-family:var(--body);font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>Câu nói cho con</h1>
<p class="sub">Bấm ▶ để nghe từng câu, hoặc nghe tất cả theo thứ tự.</p>
<div class="bar">
<button class="primary" id="all">▶ Nghe tất cả</button>
<button id="stop">■ Dừng</button>
<label for="rate">Tốc độ <select id="rate"><option value="0.6">Rất chậm</option><option value="0.75" selected>Chậm</option><option value="0.9">Hơi chậm</option><option value="1">Bình thường</option></select></label>
<label for="gap">Nghỉ giữa câu <select id="gap"><option value="2000">2 giây</option><option value="4000" selected>4 giây</option><option value="6000">6 giây</option><option value="10000">10 giây</option></select></label>
<label for="inner">Trong một câu <select id="inner"><option value="500">0.5 giây</option><option value="1500" selected>1.5 giây</option><option value="3000">3 giây</option></select></label>
<label for="voice">Giọng <select id="voice"></select></label>
</div>
<div id="list"><p class="note">Đang tải…</p></div>
<h2>Bảng chữ cái</h2>
<div class="abc" id="abc"></div>
<h2>Bảng số</h2>
<div class="abc" id="nums"></div>
<p class="note" id="msg">Đọc file current/kids-vietnamese-phrases.md mới nhất, bằng giọng tiếng Việt có sẵn trên máy.</p>
</div>
<script>
// Parse kids-vietnamese-phrases.md: "### N. Title" sections, "- ..." lines with quoted phrases
function parse(md){
  const sections=[];let cur=null;
  md.split('\n').forEach(l=>{
    if(l.startsWith('### ')){cur={title:l.replace(/^### \d+\.\s*/,''),items:[]};sections.push(cur)}
    else if(l.startsWith('- ')&&cur){
      const parts=[];const re=/(?:(Them|Guest|Me|Follow-up):\s*)?"([^"]+)"/g;let m;
      while((m=re.exec(l))){parts.push({who:m[1]||(parts.length?'Follow-up':'Me'),text:m[2]})}
      if(parts.length)cur.items.push(parts);
    }
  });
  return sections.filter(s=>s.items.length);
}
// Split one phrase into sentences so each can be spoken with a pause after it
function splitSentences(t){
  return (t.match(/[^.?!]+[.?!]+|[^.?!]+$/g)||[t]).map(s=>s.trim()).filter(Boolean);
}
const list=document.getElementById('list');const rows=[];
function render(sections){
  list.innerHTML='';
  sections.forEach(s=>{
    const h=document.createElement('h2');h.textContent=s.title;list.appendChild(h);
    const ol=document.createElement('ol');
    // A line ending in "?" is a question; the lines after it are its answers, until the next question
    let afterQ=false;
    s.items.forEach(parts=>{
      const li=document.createElement('li');
      const isQ=parts.length===1&&parts[0].text.trim().endsWith('?');
      if(isQ){li.classList.add('q');afterQ=true}else if(afterQ)li.classList.add('a');
      const b=document.createElement('button');b.className='play';b.textContent='▶';b.setAttribute('aria-label','Play');
      const t=document.createElement('div');t.className='txt';
      parts.forEach(p=>{
        if(parts.length>1){const w=document.createElement('span');w.className='who';w.textContent=p.who;t.appendChild(w)}
        const d=document.createElement('div');d.textContent=p.text;t.appendChild(d);
      });
      li.append(b,t);ol.appendChild(li);
      const idx=rows.length;rows.push({li,segs:parts.flatMap(p=>splitSentences(p.text))});
      b.onclick=()=>playFrom(idx,false);
    });
    list.appendChild(ol);
  });
}
fetch('../current/kids-vietnamese-phrases.md',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
  .then(md=>render(parse(md)))
  .catch(()=>{list.innerHTML='<p class="note">Không tải được danh sách. Kiểm tra mạng rồi tải lại trang.</p>'});

const synth=window.speechSynthesis;const vSel=document.getElementById('voice');let voices=[];
function loadVoices(){
  if(!synth)return;
  // Vietnamese voices only: lang can be "vi-VN" or "vi_VN"; some engines only name them
  voices=synth.getVoices().filter(v=>/^vi([-_]|$)/i.test(v.lang)||/vietnam|tiếng việt|linh/i.test(v.name));
  vSel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';vSel.appendChild(o)});
  // Prefer an on-device voice (sounds more natural and works offline on iPhone)
  const pref=voices.findIndex(v=>v.localService);if(pref>=0)vSel.value=pref;
  document.getElementById('all').disabled=!voices.length;
  document.getElementById('msg').innerHTML=voices.length
    ?'Đọc file current/kids-vietnamese-phrases.md mới nhất, bằng giọng tiếng Việt có sẵn trên máy.'
    :'<strong>Máy chưa có giọng tiếng Việt</strong>, nên trang không đọc để tránh giọng nước ngoài.<br>'
     +'iPhone: Cài đặt › Trợ năng › Nội dung được đọc › Giọng nói › Tiếng Việt › tải giọng <em>Linh</em>, rồi mở trang bằng Safari.<br>'
     +'Android: Cài đặt › Quản lý chung › Ngôn ngữ › Chuyển văn bản thành giọng nói › Google › Cài đặt dữ liệu giọng nói › Tiếng Việt, rồi mở trang bằng Chrome.';
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else{document.getElementById('msg').textContent='Trình duyệt này không hỗ trợ đọc.'}
let token=0;
function mark(i){rows.forEach((r,j)=>r.li.classList.toggle('on',j===i));if(i>=0)rows[i].li.scrollIntoView({block:'nearest',behavior:'smooth'})}
function playFrom(i,cont){
  if(!synth||!voices.length)return;synth.cancel();const my=++token;
  const ms=id=>parseInt(document.getElementById(id).value,10);
  const say=(k,s)=>{
    if(my!==token)return;
    const segs=rows[k].segs;
    const u=new SpeechSynthesisUtterance(segs[s]);
    u.rate=parseFloat(document.getElementById('rate').value);u.lang='vi-VN';
    const v=voices[vSel.value];if(v)u.voice=v;
    u.onend=()=>{
      if(my!==token)return;
      if(s+1<segs.length)setTimeout(()=>say(k,s+1),ms('inner'));
      else if(cont)setTimeout(()=>go(k+1),ms('gap'));
      else mark(-1);
    };
    synth.speak(u);
  };
  const go=k=>{
    if(my!==token||k>=rows.length){mark(-1);return}
    mark(k);say(k,0);
  };
  go(i);
}
document.getElementById('all').onclick=()=>playFrom(0,true);
document.getElementById('stop').onclick=()=>{token++;synth&&synth.cancel();mark(-1)};

// Vietnamese alphabet: each letter is a button that says its sound the way kids learn it
// Optional 3rd value is what the voice reads, when a lone accented vowel gets spelled out ("a sắc")
const ABC=[['a','a'],['ă','á','á!'],['â','ớ','ớ!'],['b','bờ'],['c','cờ'],['d','dờ'],['đ','đờ'],['e','e'],['ê','ê'],
  ['g','gờ'],['h','hờ'],['i','i'],['k','ca'],['l','lờ'],['m','mờ'],['n','nờ'],['o','o'],['ô','ô'],['ơ','ơ'],
  ['p','pờ'],['q','quờ'],['r','rờ'],['s','sờ'],['t','tờ'],['u','u'],['ư','ư'],['v','vờ'],['x','xờ'],['y','i dài']];
// Numbers 1-10, read the same way
const NUMS=[['1','một'],['2','hai'],['3','ba'],['4','bốn'],['5','năm'],['6','sáu'],['7','bảy'],['8','tám'],['9','chín'],['10','mười']];
// Fill a grid with one button per item; tapping says the item's sound
function makeGrid(id,items){
  const grid=document.getElementById(id);
  items.forEach(([label,sound,speak])=>{
    const b=document.createElement('button');
    b.innerHTML=label+'<small>'+sound+'</small>';
    b.setAttribute('aria-label','Đọc '+sound);
    b.onclick=()=>{
      if(!synth||!voices.length)return;
      token++;synth.cancel();mark(-1);
      document.querySelectorAll('.abc button').forEach(x=>x.classList.toggle('on',x===b));
      const u=new SpeechSynthesisUtterance(speak||sound);
      u.rate=parseFloat(document.getElementById('rate').value);u.lang='vi-VN';
      const v=voices[vSel.value];if(v)u.voice=v;
      u.onend=()=>b.classList.remove('on');
      synth.speak(u);
    };
    grid.appendChild(b);
  });
}
makeGrid('abc',ABC.map(([letter,sound,speak])=>[letter.toUpperCase(),sound,speak]));
makeGrid('nums',NUMS);
</script>
</body>
</html>
