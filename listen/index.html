<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core Phrases Listening</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: single reading column, sticky player bar, one row per phrase */
:root{--bg:#f6f7f4;--fg:#1d2420;--muted:#5f6b64;--card:#ffffff;--line:#dfe3dd;--accent:#1f7a5c;--accent-ink:#ffffff;--hi:#e3f2ea;
--display:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141916;--fg:#e8ece9;--muted:#9aa69f;--card:#1c231f;--line:#2c3530;--accent:#5cc49c;--accent-ink:#0f1512;--hi:#21362c;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1{font-family:var(--display);font-weight:600;font-size:1.8rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label{color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:center}
select{font:inherit;font-size:.9rem;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;max-width:180px}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:28px 0 8px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
li.on{background:var(--hi);border-color:var(--accent)}
li .play{flex:none;width:40px;height:40px;padding:0;border-radius:50%;font-size:14px}
.txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.who{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.9rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<h1>Core Phrases</h1>
<p class="sub">Tap a phrase to hear it, or play them all in order.</p>
<div class="bar">
<button class="primary" id="all">▶ Play all</button>
<button id="stop">■ Stop</button>
<label for="rate">Speed <select id="rate"><option value="0.75">Slow</option><option value="0.9" selected>A bit slower</option><option value="1">Normal</option></select></label>
<label for="gap">Pause <select id="gap"><option value="2000">2 sec</option><option value="4000" selected>4 sec</option><option value="6000">6 sec</option><option value="10000">10 sec</option></select></label>
<label for="voice">Voice <select id="voice"></select></label>
</div>
<div id="list"><p class="note">Loading phrases…</p></div>
<p class="note" id="msg">Reads the latest current/core-phrases.md from this repo, using your device's built-in English voice.</p>
</div>
<script>
// Parse core-phrases.md: "### N. Title" sections, "- ..." lines with quoted phrases
function parse(md){
  const sections=[];let cur=null;
  md.split('\n').forEach(l=>{
    if(l.startsWith('### ')){cur={title:l.replace(/^### \d+\.\s*/,''),items:[]};sections.push(cur)}
    else if(l.startsWith('- ')&&cur){
      const parts=[];const re=/(?:(Them|Guest|Me|Follow-up):\s*)?"([^"]+)"/g;let m;
      while((m=re.exec(l))){parts.push({who:m[1]||(parts.length?'Follow-up':'Me'),text:m[2]})}
      if(parts.length)cur.items.push(parts);
    }
  });
  return sections.filter(s=>s.items.length);
}
const list=document.getElementById('list');const rows=[];
function render(sections){
  list.innerHTML='';
  sections.forEach(s=>{
    const h=document.createElement('h2');h.textContent=s.title;list.appendChild(h);
    const ol=document.createElement('ol');
    s.items.forEach(parts=>{
      const li=document.createElement('li');
      const b=document.createElement('button');b.className='play';b.textContent='▶';b.setAttribute('aria-label','Play');
      const t=document.createElement('div');t.className='txt';
      parts.forEach(p=>{
        if(parts.length>1){const w=document.createElement('span');w.className='who';w.textContent=p.who;t.appendChild(w)}
        const d=document.createElement('div');d.textContent=p.text;t.appendChild(d);
      });
      li.append(b,t);ol.appendChild(li);
      const idx=rows.length;rows.push({li,text:parts.map(p=>p.text).join(' ... ')});
      b.onclick=()=>playFrom(idx,false);
    });
    list.appendChild(ol);
  });
}
fetch('../current/core-phrases.md',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
  .then(md=>render(parse(md)))
  .catch(()=>{list.innerHTML='<p class="note">Could not load the phrase list. Check your connection and reload.</p>'});

const synth=window.speechSynthesis;const vSel=document.getElementById('voice');let voices=[];
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));vSel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';vSel.appendChild(o)});
  const pref=voices.findIndex(v=>/en-US/i.test(v.lang));if(pref>=0)vSel.value=pref;
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else{document.getElementById('msg').textContent='Speech is not available in this browser.'}
let token=0;
function mark(i){rows.forEach((r,j)=>r.li.classList.toggle('on',j===i));if(i>=0)rows[i].li.scrollIntoView({block:'nearest',behavior:'smooth'})}
function playFrom(i,cont){
  if(!synth)return;synth.cancel();const my=++token;
  const go=k=>{
    if(my!==token||k>=rows.length){mark(-1);return}
    mark(k);
    const u=new SpeechSynthesisUtterance(rows[k].text);
    u.rate=parseFloat(document.getElementById('rate').value);u.lang='en-US';
    const v=voices[vSel.value];if(v)u.voice=v;
    u.onend=()=>{if(my!==token)return;if(cont)setTimeout(()=>go(k+1),parseInt(document.getElementById('gap').value,10));else mark(-1)};
    synth.speak(u);
  };
  go(i);
}
document.getElementById('all').onclick=()=>playFrom(0,true);
document.getElementById('stop').onclick=()=>{token++;synth&&synth.cancel();mark(-1)};
</script>
</body>
</html>
